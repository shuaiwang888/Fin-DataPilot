name: Deploy Backend to HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Skills/**"
      - ".github/workflows/deploy-backend-hf.yml"
      - "deploy-to-hf.sh"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      # Write the SSH key from secrets to a file, then point git at it directly.
      # This avoids the webfactory/ssh-agent stdin-loading path that was failing
      # with "error in libcrypto" on some runners.
      - name: Install deploy key
        env:
          HF_SSH_PRIVATE_KEY: ${{ secrets.HF_SSH_PRIVATE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          # HTTPS is the preferred path when a scoped HF token is available;
          # it needs no SSH bootstrap and avoids an unnecessary network check.
          if [[ -n "${HF_TOKEN:-}" ]]; then
            echo "HF_TOKEN is configured; using HTTPS authentication."
            exit 0
          fi

          if [[ -z "${HF_SSH_PRIVATE_KEY:-}" ]]; then
            echo "::warning::Neither HF_TOKEN nor HF_SSH_PRIVATE_KEY is configured. Deployment will fail with an authentication error."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Normalise line endings (strip \r) and write the key.
          printf '%s' "$HF_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # HF does not expose SSH on every CI network, so avoid a separate
          # ssh-keyscan call. In this fresh ephemeral runner accept the first
          # key observed for hf.co and retain it for the duration of the job.
          git config --global core.sshCommand \
            "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          echo "✓ deploy key installed"

      - name: Deploy
        env:
          # Pass HF_TOKEN through so deploy-to-hf.sh can use the HTTPS
          # path when SSH isn't available. Either secret works on its
          # own; if both are set, HF_TOKEN wins.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          ./deploy-to-hf.sh --message "ci: ${SHORT_SHA}"
